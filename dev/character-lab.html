<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070d1f; color: #fff; font: 14px system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #ui { position: fixed; left: 12px; top: 12px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70vw; }
    #ui button, #ui select { padding: 6px 10px; border: 0; border-radius: 4px; background: #13244f; color: #fff; cursor: pointer; }
    #info { position: fixed; right: 12px; top: 12px; z-index: 2; white-space: pre; font: 12px ui-monospace, monospace; background: rgba(0,0,0,.5); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ui"></div>
  <pre id="info"></pre>
  <script type="module" src="./character-lab.js"></script>
</body>
</html>
